<meta charset="UTF-8"/>

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  body{font-family:'Noto Sans Bengali','DM Sans',sans-serif;background:#f7f0f5;min-height:100vh}
  select,textarea,input,button{font-family:inherit}
  select{-webkit-appearance:none;appearance:none}
  .bn{font-family:'Noto Sans Bengali','DM Sans',sans-serif}
  .mono{font-family:'DM Mono','DM Sans',sans-serif!important}

  @keyframes blink{0%,100%{opacity:1}50%{opacity:0.08}}
  @keyframes blinkBlue{0%,100%{opacity:1;color:#1565c0}50%{opacity:0.15;color:#1565c0}}
  .wb{animation:blink 1s ease-in-out infinite;display:inline-block}
  .wbr{animation:blinkRed 0.9s ease-in-out infinite;display:inline-block;color:#c62828}

  .status-swatch{width:13px;height:13px;flex-shrink:0;border-radius:3px;border:2px solid;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}

  .card{border-radius:14px;border:1.5px solid;border-left:5px solid;margin-bottom:9px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
  .card-full   {background:#e8f5e9;border-color:#66bb6a33;border-left-color:#2e7d32}
  .card-partial{background:#fffde7;border-color:#f9a82555;border-left-color:#f9a825}
  .card-remiss {background:#ffcdd2;border-color:#7f000055;border-left-color:#7f0000}
  .card-newmiss{background:#fce4f5;border-color:#d500a066;border-left-color:#d500a0}
  .card-grace  {background:#f3e5f5;border-color:#ab47bc88;border-left-color:#7b1fa2}
  .card-active {background:#ffffff;border-color:#e0d0ee;  border-left-color:#8a8a8a}

  .card-header{display:grid;grid-template-columns:30px 1fr auto 18px;align-items:center;gap:0 10px;padding:10px 12px;min-height:70px;cursor:pointer}
  .quick-icon-btn{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
  .quick-call{background:linear-gradient(135deg,#c8005e,#e91e8c)}
  .quick-sms{background:linear-gradient(135deg,#7b1fa2,#ab47bc)}
  .cdo-line{font-size:9.5px;color:#8a5a75;font-weight:700;margin-top:2px}
  .card-body{border-top:1px dashed #e8d8f0;padding:14px 12px 16px}

  .sl-badge{background:#d6006e;color:#fff;border-radius:7px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;font-family:'DM Mono',sans-serif}
  .member-name{font-weight:700;font-size:14px;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 44px);font-family:'Noto Sans Bengali','DM Sans',sans-serif}
  .vo-pill{background:#444;color:#fff;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:600;font-family:'DM Mono',sans-serif}
  .cdo-pill{background:#fce4ec;color:#c8005e;border-radius:5px;padding:1px 6px;font-size:9px;font-weight:700;font-family:'DM Mono',sans-serif}

  .expand-arrow{color:#c8005e;font-size:16px;font-weight:700;flex-shrink:0}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .info-cell{background:rgba(255,255,255,0.78);border-radius:8px;padding:8px 9px}
  .info-label{font-size:9px;color:#d6006e;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;font-family:'Noto Sans Bengali','DM Sans',sans-serif}
  .info-value{font-size:13px;font-weight:600;color:#222;font-family:'DM Mono','DM Sans',sans-serif}
  .info-full{grid-column:1 / -1}

  .btn-primary{width:100%;background:linear-gradient(135deg,#c8005e,#e91e8c);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(200,0,94,0.25)}
  .btn-secondary{width:100%;background:#fff;color:#7b1fa2;border:2px solid #7b1fa244;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn-ghost{background:none;border:none;color:#999;font-weight:700;cursor:pointer;font-size:13px;font-family:inherit}

  .styled-select{width:100%;border:2px solid #e91e8c33;border-radius:10px;padding:8px 30px 8px 10px;font-size:12px;background:#fdf5f9;color:#222;cursor:pointer;outline:none;appearance:none}
  .select-wrap{position:relative}
  .select-wrap::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:#d6006e;pointer-events:none}
  input[type=date],input[type=text],input[type=number],input[type=tel],textarea{width:100%;box-sizing:border-box;border:2px solid #e91e8c33;border-radius:10px;padding:9px 10px;font-size:13px;background:#fdf5f9;outline:none}
  textarea{resize:vertical}
  label.f-label{font-size:11px;font-weight:700;color:#d6006e;text-transform:uppercase;letter-spacing:0.6px;display:block;margin-bottom:6px}

  #app-header{background:linear-gradient(135deg,#c8005e 0%,#e91e8c 55%,#c2185b 100%);box-shadow:0 4px 20px rgba(200,0,94,0.35);position:sticky;top:0;z-index:100}
  .header-inner{max-width:1100px;margin:0 auto;padding:14px 14px 0}

  .panel{background:#fff;border-bottom:1px solid #f0e0f0;box-shadow:0 3px 12px rgba(200,0,94,0.08)}
  .panel-inner{max-width:1100px;margin:0 auto;padding:12px 14px 14px}
  .panel-title{font-size:10px;font-weight:800;color:#d6006e;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}

  #overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:flex-end;justify-content:center}
  #overlay.open{display:flex}
  #edit-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:540px;max-height:92vh;overflow-y:auto}

  .popup{position:absolute;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 8px 32px rgba(0,0,0,0.18);border:1px solid #f0e0f0;z-index:201}

  .page-btn{background:#fce4ec;color:#d6006e;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:13px;font-family:'DM Mono',sans-serif}
  .page-btn:disabled{background:#ececec;color:#ccc;cursor:default}
  .page-btn.active{background:#d6006e;color:#fff}

  /* bottom tab bar */
  #tabbar{position:sticky;bottom:0;background:#fff;border-top:1px solid #f0e0f0;display:flex;box-shadow:0 -3px 14px rgba(0,0,0,0.06);z-index:90}
  .tab-btn{flex:1;background:none;border:none;padding:9px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:#bbb;font-size:10px;font-weight:700}
  .tab-btn.active{color:#d6006e}
  .tab-btn svg{width:20px;height:20px}

  /* role badge */
  .role-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700}

  /* login */
  #login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 26px;background:linear-gradient(160deg,#c8005e 0%,#7b1fa2 100%)}
  .pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;background:transparent}
  .pin-dot.filled{background:#fff}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
  .key-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22);color:#fff;border-radius:14px;padding:16px 0;font-size:18px;font-weight:700;cursor:pointer}
  .key-btn:active{background:rgba(255,255,255,0.28)}
  .demo-chip{background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.28);color:#fff;border-radius:10px;padding:9px 12px;font-size:11px;cursor:pointer;text-align:left;width:100%;margin-bottom:8px}
  .demo-chip b{display:block;font-size:12.5px;margin-bottom:1px}

  /* escalation badge */
  .esc-badge{background:#b71c1c;color:#fff;border-radius:6px;padding:2px 7px;font-size:9px;font-weight:800;display:inline-flex;align-items:center;gap:3px}

  /* toast */
  #toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:30px;font-size:12.5px;font-weight:600;z-index:1200;box-shadow:0 6px 20px rgba(0,0,0,0.3);display:none;max-width:88%;text-align:center}
  #toast.show{display:block}

  html{height:100%}
  body{display:flex;justify-content:center;align-items:flex-start;background:#b08aaf;min-height:100vh;overflow:hidden;padding:0}
  #mobile-shell{width:100%;max-width:430px;height:100vh;overflow-y:auto;overflow-x:hidden;background:#f7f0f5;box-shadow:0 0 60px rgba(80,0,60,0.35);position:relative;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
  #overlay{position:fixed}
  #page-content{flex:1}

  .fab{position:fixed;left:50%;transform:translateX(calc(-50% + 155px));bottom:72px;background:linear-gradient(135deg,#c8005e,#e91e8c);color:#fff;border:none;border-radius:16px;width:52px;height:52px;box-shadow:0 6px 18px rgba(200,0,94,0.45);cursor:pointer;font-size:24px;z-index:95;display:flex;align-items:center;justify-content:center}
  @media (max-width:430px){.fab{transform:none;right:16px;left:auto}}
</style>
</head>

function addWorkingDays(dateStr,n){
  if(!dateStr)return"";
  let d=new Date(dateStr),count=0;
  while(count<n){d.setDate(d.getDate()+1);if(d.getDay()!==0&&d.getDay()!==6)count++;}
  return d.toISOString().split("T")[0];
}
const daysDiff    = d=>d?Math.floor((TODAY-new Date(d))/86400000):null;
const getCollected= row=>row.payments.reduce((s,p)=>s+p.amount,0);
const getLatest   = row=>!row.payments.length?"":([...row.payments].sort((a,b)=>new Date(b.date)-new Date(a.date))[0].date);
const fmt         = n=>"৳"+Number(n||0).toLocaleString("en-IN");
const fmtDate     = d=>d?new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—";
const fmtDateTime = d=>d?new Date(d).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const commitRangeStr = row=>(row.commitmentFrom&&row.commitmentTo)?`${fmtDate(row.commitmentFrom)} – ${fmtDate(row.commitmentTo)}`:"—";
// Grace period is purely a function of Disbursement Date vs "today" — no manual toggle.
// Day 0-14 since disbursement (15 calendar days) = Grace Period. Day 15-29 = normal tracking
// (reason/commitment apply as usual). From day 30 onward (15 days of Grace + 15 more) the
// record is simply dropped.
function daysSinceDisbursement(row){
  return row.disbursementDate ? Math.floor((TODAY-new Date(row.disbursementDate))/86400000) : null;
}
// Same calculation, for a raw date string (used to live-preview Grace Period on the Register form).
function daysSinceRegDisb(dateStr){
  return dateStr ? Math.floor((TODAY-new Date(dateStr))/86400000) : null;
}
// Whether the Register form's current Disbursement Date would classify as Grace Period —
// drives the auto-selected Yes/No tiles and whether Miss Information is shown at all.
function regFormIsGrace(){
  const d=daysSinceRegDisb(regForm.disbursementDate);
  return d!==null && d>=0 && d<15;
}
function isGraceActive(row){
  const d=daysSinceDisbursement(row);
  return d!==null && d>=0 && d<15;
}
function graceEndDate(row){
  if(!row.disbursementDate) return null;
  const end=new Date(row.disbursementDate); end.setDate(end.getDate()+15); return end;
}
function graceDaysLeft(row){
  const end=graceEndDate(row);
  if(!end) return 0;
  return Math.max(0, Math.ceil((end-TODAY)/86400000));
}
function isDroppable(row){
  const d=daysSinceDisbursement(row);
  if(d===null || d<30) return false;
  // The 30-day drop only clears out loans that sat idle the whole time — no collection ever
  // recorded, no commitment ever missed, and (crucially) no commitment currently pending. A
  // record with any of that — a payment, a missed commitment on file, or a Commitment Date
  // range that just hasn't come due yet — is an established, ongoing case and is never
  // dropped by this rule; it persists exactly as before, resolved only by a Full Collection.
  if(getCollected(row)>0 || row.remissLocked || (row.missedCommitmentCount||0)>0) return false;
  if(row.commitmentTo && new Date(row.commitmentTo)>=TODAY) return false;
  return true;
}

// Status classification engine — strictly per BRD FR-03..FR-08, extended for the grace
// countdown and the sticky Re-miss tag.
// Precedence: Grace(while active) > Full(FR-03) > Re-miss(FR-07, sticky) > Partial(FR-06) > New(FR-05) > Active(FR-08)
function getStatus(row){
  if(isGraceActive(row)) return "grace";
  const c=getCollected(row);
  if(c>=row.targetAmount) return "full";
  // Sticky: once a commitment range has passed unresolved, the record stays tagged
  // Re-miss — it does NOT clear just because a new (not-yet-due) commitment range is set.
  // Only a Full Collection clears it.
  if(row.remissLocked) return "remiss";
  if(c>0) return "partial";
  if(!row.previousMisses || row.previousMisses===0) return "newmiss";
  return "active";
}
// Reason and Commitment Date (now a range) are mandatory everywhere a record is created or
// updated, so a record can never be left without either — nothing to flag here anymore.

// Runs whenever TODAY moves (via the Time Simulator) or DATA is freshly loaded.
// Two things happen here, in this order:
//  1. Any commitment range whose end date has newly passed unresolved (non-grace) is
//     detected and its consequences applied automatically — Re-miss lock, history entry,
//     escalation. This runs FIRST so a row that has just become a genuine Re-miss case is
//     never mistaken for an idle loan by step 2 on this same pass.
//  2. Any record more than 30 days past its Disbursement Date (15 days of Grace Period +
//     15 more days) that never had any activity is simply dropped — no further action needed.
// Returns the number of records dropped, so callers can surface it if useful.
function runTimeSweep(){
  DATA.forEach(row=>{
    if(getCollected(row)>=row.targetAmount) return; // already resolved
    if(isGraceActive(row)) return;                   // still inside an active grace window
    if(!row.commitmentTo) return;                     // nothing promised yet, nothing to miss
    if(new Date(row.commitmentTo) >= TODAY) return;    // not due yet
    if(row.lastCountedCommitmentTo === row.commitmentTo) return; // already counted this one
    const collectedNow = getCollected(row);
    row.missedCommitmentCount = (row.missedCommitmentCount||0) + 1;
    row.remissLocked = true;
    row.remissHistory = row.remissHistory||[];
    row.remissHistory.push({
      commitmentFrom: row.commitmentFrom, commitmentTo: row.commitmentTo,
      detectedAt: nowStr(),
      outcome: collectedNow>0 ? "partial" : "missed",
      dueAtTime: row.targetAmount - collectedNow,
      reason: row.reason||"",
    });
    row.lastCountedCommitmentTo = row.commitmentTo;
    if(row.missedCommitmentCount>=2) row.escalated=true;
  });

  const before=DATA.length;
  DATA = DATA.filter(row=>!isDroppable(row)); // idle >30 days since disbursement — drop it
  return before-DATA.length;
}

// Real Re-miss history + payment trail for a loan — no synthetic data. missedCommitmentCount
// and remissHistory are the persisted record of every cycle the runTimeSweep()/Record Collection
// flow ever detected as missed, and payments is the full collection trail, partial or full — all
// of it stays in the record even after eventual Full Collection ("stays in his/her history").
function loanHistoryStats(row){
  return {
    missedCount: row.missedCommitmentCount||0,
    totalPaid: getCollected(row),
  };
}

function reasonDisplay(key){
  const idx=REASON_KEYS.indexOf(key);

function pushLog(row,action){
  row.auditLog=row.auditLog||[];

}

// Urgency ordering for the "Recent Schedule Miss" overview preview
function urgencyRank(row){
  if(row.escalated) return 0;
  const st=getStatus(row);
  if(st==="remiss") return 1;
  if(st==="newmiss") return 2;
  if(st==="partial") return 3;
  if(st==="active") return 4;
  if(st==="grace") return 5;
  return 6; // full
}
function sortByUrgency(rows){
  return [...rows].sort((a,b)=> urgencyRank(a)-urgencyRank(b) || (b.loanId>a.loanId?1:-1) );
}
// Full Collection records are never archived — they just sort to the end of the list,
// everything else keeps its natural (insertion) order.
function sortFullLast(rows){
  return [...rows].sort((a,b)=>{
    const af=getStatus(a)==="full"?1:0, bf=getStatus(b)==="full"?1:0;
    return af-bf;
  });
}

const DB_KEY = "brac_smr_db_v1";
function saveDB(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify({
      version:1, today:TODAY.toISOString(), loanSeq:__loanSeq, notifSeq:__notifId,
      data:DATA, notifications:NOTIFICATIONS,
    }));
  }catch(e){ console.warn("DB save failed", e); }
}
function loadDB(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(!raw) return false;
    const db=JSON.parse(raw);
    if(!db || !Array.isArray(db.data)) return false;
    TODAY = new Date(db.today);
    __loanSeq = db.loanSeq||0;
    __notifId = db.notifSeq||0;
    DATA = db.data;
    NOTIFICATIONS = db.notifications||[];
    return true;
  }catch(e){ console.warn("DB load failed", e); return false; }
}
function exportDB(){
  const payload = JSON.stringify({
    version:1, today:TODAY.toISOString(), loanSeq:__loanSeq, notifSeq:__notifId,
    data:DATA, notifications:NOTIFICATIONS,
  }, null, 2);
  const blob=new Blob([payload],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="schedule-miss-db.json";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },200);
}
function importDBFromFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const db=JSON.parse(e.target.result);
      if(!db || !Array.isArray(db.data)) throw new Error("bad file");
      TODAY = new Date(db.today);
      __loanSeq = db.loanSeq||0;
      __notifId = db.notifSeq||0;
      DATA = db.data;
      NOTIFICATIONS = db.notifications||[];
      saveDB();
      currentUser=null; // back to login for a clean, unambiguous reload of the new dataset
      showMenu=false; showNotif=false; showTimeSim=false;
      render();
      toast(lang==="en"?"✅ Database imported":"✅ ডেটাবেস আমদানি হয়েছে");
    }catch(err){
      toast(lang==="en"?"⚠️ Invalid database file":"⚠️ অবৈধ ডেটাবেস ফাইল");
    }
  };
  reader.readAsText(file);
}
function resetDB(){
  localStorage.removeItem(DB_KEY);
  __seq=0; __loanSeq=0; __notifId=0; __nameIdx=0;
  TODAY = new Date("2025-04-15T09:00:00");
  DATA = generateData();

}

const rowCommitCoversToday = row=>{
  if(!row.commitmentFrom || !row.commitmentTo) return false;
  const t=nowDateStr();
  return row.commitmentFrom<=t && t<=row.commitmentTo;
};
function getFiltered(){
  return scopedData().filter(r=>{
    if(filters.cdo!=="All" && r.cdo!==filters.cdo) return false;
    if(filters.voCode!=="All" && r.voCode!==filters.voCode) return false;
    if(filters.reason!=="All" && r.reason!==filters.reason) return false;
    if(filters.status!=="All" && getStatus(r)!==filters.status) return false;
    if(filters.targetDate && r.targetDate!==filters.targetDate) return false;
    if(filters.collectionDate && getLatest(r)!==filters.collectionDate) return false;
    if(commitToday && !rowCommitCoversToday(r)) return false;
    if(filters.followUpStatus!=="All"){
      const fu=r.followUp;
      if(filters.followUpStatus==="pending" && fu) return false;
      if(filters.followUpStatus==="completed" && !(fu && getCollected(r)>=r.targetAmount)) return false;
      if(filters.followUpStatus==="overdue" && !(fu && new Date(fu.date)<TODAY && getCollected(r)<r.targetAmount)) return false;
    }
    if(search){
      const q=search.toLowerCase();
      return r.memberName.toLowerCase().includes(q)||r.memberNo.includes(q)||r.voCode.includes(q);
    }
    return true;
  });
}
function hasFilter(){
  return search||filters.cdo!=="All"||filters.voCode!=="All"||filters.reason!=="All"||filters.status!=="All"||filters.targetDate||filters.collectionDate||filters.followUpStatus!=="All";
}

  };
}

let dailyPushDismissed = false;
function tryLogin(){
  const u=USERS[loginPin];
  if(u){
    currentUser=u; loginPin=""; loginError=false; activeTab="dashboard"; dashboardExpanded=false; page=1;
    dailyPushDismissed = (u.role!=="cdo"); // FR-17: only CDO gets the daily summary push
    render();
    toast(`${t("welcomeBack")}, ${currentUser.name}`);
  }
  else { loginError=true; loginPin=""; render(); }
}
function bindLoginEvents(){
  document.querySelectorAll(".key-btn").forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.key;
      if(k==="⌫") loginPin=loginPin.slice(0,-1);
      else if(loginPin.length<4) loginPin+=k;
      if(loginPin.length===4) return tryLogin();
      render();
    };
  });
  document.querySelectorAll(".demo-chip").forEach(b=>{
    b.onclick=()=>{ loginPin=b.dataset.pin; tryLogin(); };
  });
}

  const bnClass=lang==="bn"?"bn":"";
  if(val==="All") return `<span class="${bnClass}">${t('allOpt')}</span>`;
  const map={newmiss:t("stNewMiss"),remiss:t("stRemiss"),partial:t("stPartial"),full:t("stFull"),grace:t("stGrace"),active:t("stActive")};
  return `${swatchHtml(val)} <span class="${bnClass}" style="font-size:12px">${map[val]||val}</span>`;
}

// ══════════════════════════════════════════════════════════════
// CARD (shared, role-aware)
// ══════════════════════════════════════════════════════════════
function renderCard(row, STATUS_LABELS){
  const bnClass=lang==="bn"?"bn":"";
  const isBM=currentUser.role==="bm";
  const status=getStatus(row);
  const sc={
    full:{bg:"#e8f5e9",border:"#66bb6a33",left:"#2e7d32"},
    partial:{bg:"#fffde7",border:"#f9a82555",left:"#f9a825"},
    remiss:{bg:"#ffcdd2",border:"#7f000055",left:"#7f0000"},
    newmiss:{bg:"#fce4f5",border:"#d500a066",left:"#d500a0"},
    grace:{bg:"#f3e5f5",border:"#ab47bc88",left:"#7b1fa2"},
    active:{bg:"#ffffff",border:"#e0d0ee",left:"#8a8a8a"},
  }[status];
  const due=row.targetAmount-getCollected(row);
  const phoneClean=row.phone.replace(/-/g,"");

  const quickActions = `
    <div style="display:flex;gap:5px;flex-shrink:0" onclick="event.stopPropagation()">
      <a class="quick-icon-btn quick-call" href="tel:${phoneClean}" title="${t('call')}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.65A2 2 0 012 1h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.4a16 16 0 006.72 6.72l1.77-1.77a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
      </a>
      <a class="quick-icon-btn quick-sms" href="sms:${phoneClean}" title="${t('sms')}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      </a>
    </div>`;

  // Compact list row only — tapping it navigates to a dedicated detail page instead of
  // expanding inline, so the list stays scannable and the detail gets room to breathe.
  return `
  <div class="card" style="background:${sc.bg};border-color:${sc.border};border-left:5px solid ${sc.left}">
    <div class="card-header" data-loan-id="${row.loanId}">
      <div class="sl-badge">${row.loanId.replace('LN-0','').replace(/^0+/,'')||row.loanId}</div>
      <div style="min-width:0;overflow:hidden">
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">
          <span class="vo-pill mono">VO ${row.voCode}</span>
          ${status==="newmiss"?`<span class="wbr" style="font-size:13px;line-height:1;flex-shrink:0">🔔</span>`:""}
          ${row.escalated?`<span class="esc-badge">🚨</span>`:""}
        </div>
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:3px">
          <span class="member-name">${row.memberName}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0">
            <span class="cdo-pill mono">${row.loanId}</span>
            <span style="color:#666;font-size:9px" class="mono">🕘 ${commitRangeStr(row)}</span>
          </div>
          ${quickActions}
        </div>
        ${isBM?`<div class="cdo-line ${bnClass}">👤 ${row.cdo} — ${row.cdoName}</div>`:""}
        ${status==="grace"?`<div class="${bnClass}" style="font-size:9.5px;color:#7b1fa2;font-weight:700;margin-top:2px">🌱 ${t('grEndsIn')} ${graceDaysLeft(row)} ${t('grDaysLeft')}</div>`:""}
      </div>
      <div style="text-align:right;flex-shrink:0">
        ${status==="full"
          ?`<div style="color:#2e7d32;font-weight:800;font-size:12px" class="${bnClass}">${t('paidLabel')}</div>`
          :status==="grace"
            ?`<div class="mono" style="font-weight:700;font-size:13px;color:#7b1fa2">${fmt(Math.max(0,due))}</div>`
            :`<div class="mono" style="font-weight:700;font-size:13px;color:${status==="remiss"?"#7f0000":status==="newmiss"?"#d500a0":"#c8005e"}">${fmt(due)}</div>`}
        <div style="font-size:9px;color:rgba(0,0,0,0.3);margin-top:1px" class="mono">${t('outstanding')}</div>
      </div>
      <div class="expand-arrow">›</div>
    </div>
  </div>`;
}

// Everything that used to live inside the inline card-body now lives here, reused by the
// full-page detail view below — same content, just given a whole page instead of a sliver
// of an accordion, per the "too much information in one page" feedback.
function renderRecordBody(row, isBM, STATUS_LABELS){
  const bnClass=lang==="bn"?"bn":"";
  const status=getStatus(row);
  const sc={
    full:{bg:"#e8f5e9",left:"#2e7d32"}, partial:{bg:"#fffde7",left:"#f9a825"},
    remiss:{bg:"#ffcdd2",left:"#7f0000"}, newmiss:{bg:"#fce4f5",left:"#d500a0"},
    grace:{bg:"#f3e5f5",left:"#7b1fa2"}, active:{bg:"#ffffff",left:"#8a8a8a"},
  }[status];
  const collected=getCollected(row);
  const due=row.targetAmount-collected;
  const statusLabel=STATUS_LABELS[status];
  const canRecordCollection = !isBM && status!=="full" && status!=="grace" && !!row.commitmentTo;

  // Commitment History — VO, Name and Loan No. lead the page header itself (see
  // renderRecordDetailPage); this is the "then Commitment history" part of that ordering.
  const commitHistoryBlock = status==="grace" ? "" : `
      <div class="info-cell info-full" style="margin-bottom:12px">
        <div class="info-label ${bnClass}" style="margin-bottom:4px">${t('commitHistory')}</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center">
          ${(row.commitmentHistory||[]).filter((h,i,arr)=>h.to!==row.commitmentTo && arr.findIndex(x=>x.to===h.to)===i).map(h=>
            `<span class="mono" style="font-size:11px;color:#888;text-decoration:line-through">${fmtDate(h.from)}–${fmtDate(h.to)}</span><span style="color:#ccc">→</span>`
          ).join("")}
          <span class="mono" style="font-size:11px;color:#333;font-weight:700">${commitRangeStr(row)}</span>
        </div>
      </div>`;

  return `
      ${status!=="active"?`
      <div style="background:rgba(0,0,0,0.025);border-radius:8px;padding:7px 10px;margin-bottom:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <div style="width:10px;height:10px;background:${sc.bg};border:2px solid ${sc.left};border-radius:2px;flex-shrink:0"></div>
        <span style="font-size:11px;font-weight:700;color:#555" class="${bnClass}">${statusLabel}</span>
        ${row.escalated?`<span class="esc-badge">${t('escalated')}</span>`:""}
      </div>`:""}
      ${row.escalated?`<div style="background:#ffebee;border:1px solid #ef9a9a;border-radius:8px;padding:7px 10px;margin-bottom:12px;font-size:10.5px;color:#b71c1c" class="${bnClass}">🚨 ${t('escalatedNote')}</div>`:""}

      ${commitHistoryBlock}

      <div class="info-grid">
        ${status==="grace"?`
          <div class="info-cell"><div class="info-label ${bnClass}">${t('voColDate')}</div><div class="info-value">${fmtDate(row.targetDate)}</div></div>
          <div class="info-cell"><div class="info-label ${bnClass}">${t('targetAmt')}</div><div class="info-value">${fmt(row.targetAmount)}</div></div>
          <div class="info-cell"><div class="info-label ${bnClass}">${t('disbursementDate')}</div><div class="info-value">${fmtDate(row.disbursementDate)}</div></div>
          <div class="info-cell"><div class="info-label ${bnClass}">${t('disbursedAmount')}</div><div class="info-value">${fmt(row.disbursedAmount||0)}</div></div>
          <div class="info-cell info-full">
            <div class="info-label ${bnClass}">${t('reasonLabel')}</div>
            <span style="background:#f3e5f5;border:1.5px solid #ab47bc55;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;color:#7b1fa2">${t('gracePeriod')}</span>
          </div>
          ${renderPhoneRow(row)}
          <div class="info-cell info-full" style="background:#f3e5f5;border:1.5px solid #ab47bc55">
            <div class="info-label" style="color:#7b1fa2;margin-bottom:6px">${t('gracePeriod')}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
              <span style="font-size:12px;color:#555" class="${bnClass}">${t('disbursementDate')}</span>
              <span style="font-size:13px;font-weight:700;color:#7b1fa2" class="mono">${fmtDate(row.disbursementDate)}</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:12px;color:#555" class="${bnClass}">${t('grEndsIn')}</span>
              <span style="font-size:13px;font-weight:700;color:#7b1fa2" class="mono">${graceDaysLeft(row)} ${t('grDaysLeft')} (${fmtDate(graceEndDate(row))})</span>
            </div>
            <div style="font-size:11px;color:#9c27b0;margin-top:5px;font-style:italic" class="${bnClass}">${t('graceDropNote')}</div>
          </div>
        `:`
          ${[
            {lk:"targetDateL",val:fmtDate(row.targetDate)},{lk:"targetAmt",val:fmt(row.targetAmount)},
            {lk:"disbursementDate",val:fmtDate(row.disbursementDate)},{lk:"disbursedAmount",val:fmt(row.disbursedAmount||0)},
            {lk:"outstanding",val:fmt(Math.max(0,due))},{lk:"nextColDate",val:commitRangeStr(row)},
          ].map(({lk,val})=>`<div class="info-cell"><div class="info-label ${bnClass}">${t(lk)}</div><div class="info-value">${val}</div></div>`).join("")}

          <div class="info-cell info-full">
            <div class="info-label ${bnClass}">${t('reasonLabel')}</div>
            ${row.reason
              ?`<div style="font-size:13px;font-weight:600;color:#222" class="${bnClass}">${reasonDisplay(row.reason)}${row.reason==="Other"&&row.reasonNote?`<span style="font-weight:400;color:#777;font-style:italic"> — ${row.reasonNote}</span>`:""}</div>`
              :`<div style="font-size:12px;color:#e53935;font-weight:700" class="${bnClass}">${t('notSelected')}</div>`}
          </div>

          ${renderPhoneRow(row)}
          ${row.payments.length>0?`
          <div class="info-cell info-full">
            <div class="info-label ${bnClass}" style="margin-bottom:6px">${t('payHistory')}</div>
            ${[...row.payments].sort((a,b)=>new Date(a.date)-new Date(b.date)).map((pm,i,arr)=>`
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#555;padding:5px 0;border-bottom:${i<arr.length-1?"1px solid #eee":"none"}">
                <div style="display:flex;align-items:center;gap:6px">
                  <span style="width:6px;height:6px;border-radius:50%;background:#2e7d32;flex-shrink:0;display:inline-block"></span>
                  <span class="mono">${fmtDate(pm.date)}</span>
                </div>
                <span style="font-weight:700;color:#2e7d32" class="mono">${fmt(pm.amount)}</span>
              </div>`).join("")}
            <div style="display:flex;justify-content:space-between;font-size:11px;color:#555;border-top:2px solid #e0e0e0;padding-top:6px;margin-top:4px" class="mono">
              <span style="font-weight:600;color:#666" class="${bnClass}">${lang==="en"?"Total":"মোট"}</span>
              <span style="font-weight:800;color:${collected>=row.targetAmount?"#2e7d32":"#f9a825"}">${fmt(collected)}</span>
            </div>
          </div>`:""}
        `}
      </div>

      <button class="history-btn" data-loan-id="${row.loanId}" style="width:100%;background:#fff;border:1.5px solid #e0d0ea;color:#7b1fa2;border-radius:10px;padding:9px;font-size:12.5px;font-weight:700;cursor:pointer;margin-bottom:10px" class="${bnClass}">${t('historyBtn')}</button>

      ${renderFollowUpBlock(row, isBM)}

      ${!isBM ? (
        status==="grace"
          ? `<div style="text-align:center;padding:8px 0">
              <div style="font-size:11px;color:#9c27b0;font-weight:600" class="${bnClass}">🔒 ${lang==='en'?'Locked during Grace Period — nothing to do until it ends.':'গ্রেস পিরিয়ড চলাকালীন লকড — শেষ না হওয়া পর্যন্ত কিছু করার নেই।'}</div>
            </div>`
          : `<div style="display:flex;flex-direction:column;gap:8px">
              ${canRecordCollection?`<button class="btn-primary collect-btn" data-loan-id="${row.loanId}" style="background:linear-gradient(135deg,#2e7d32,#66bb6a)">${t('recordCollectionBtn')}</button>`:""}
            </div>`
      ) : ""}`;
}

// The dedicated detail "page" — a back button + everything from renderRecordBody, given
// its own full screen instead of squeezed into an inline accordion.
function renderRecordDetailPage(row, STATUS_LABELS){
  const bnClass=lang==="bn"?"bn":"";

    full:{bg:"#e8f5e9",left:"#2e7d32"}, partial:{bg:"#fffde7",left:"#f9a825"},

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>

}

// Follow-up block — BM can add/edit/delete their own comment; CDO sees read-only

  const isConfirming = isBM && confirmDeleteFollowUp===row.loanId;
  return `
  <div class="info-cell info-full" style="background:#eef6ff;border:1px solid #bbdefb;margin-top:2px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${fu?"6px":"0"}">
      <div class="info-label ${bnClass}" style="color:#1565c0">${t('followUp')}</div>
      ${isBM?`<button class="fu-btn" data-loan-id="${row.loanId}" style="background:#1565c0;color:#fff;border:none;border-radius:7px;padding:4px 9px;font-size:10.5px;font-weight:700;cursor:pointer" class="${bnClass}">${fu?"✏️":t('addFollowUp')}</button>`:""}

      <div style="font-size:12px;color:#222;margin-bottom:3px"><b class="mono">${fmtDate(fu.date)}</b></div>

      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-size:10px;color:#888" class="${bnClass}">${t('followUpBy')} ${fu.by}</div>
        ${isBM?(isConfirming?`
          <div style="display:flex;gap:6px;align-items:center">
            <span style="font-size:10px;color:#c62828;font-weight:700" class="${bnClass}">${t('confirmDelete')}</span>

// ══════════════════════════════════════════════════════════════
// RECORD COLLECTION SHEET — CDO only. Closes the loop on a commitment
// date: log what was actually collected, and if it doesn't fully clear
// the due amount, force a new Commitment Date so the cycle continues
// (this is what drives Re-miss / escalation on the next pass).
// ══════════════════════════════════════════════════════════════
function renderCollectSheet(row){
  const bnClass=lang==="bn"?"bn":"";
  const due=row.targetAmount-getCollected(row);

// MEMBER HISTORY MODAL — past cycles: how many missed, how much paid partially
// ══════════════════════════════════════════════════════════════
function renderHistoryModal(row){
  const bnClass=lang==="bn"?"bn":"";
  const {missedCount,totalPaid}=loanHistoryStats(row);
  const outcomeMap={partial:{l:t('histStatusPartial'),c:"#a56d00",bg:"#fffde7"},missed:{l:t('histStatusMissed'),c:"#7f0000",bg:"#ffcdd2"}};
  const remissHist = row.remissHistory||[];
  const payments = [...row.payments].sort((a,b)=>new Date(a.date)-new Date(b.date));
  return `
  <div style="background:#fff;border-radius:18px;width:100%;max-width:420px;max-height:82vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
    <div style="background:linear-gradient(135deg,#7b1fa2,#ab47bc);padding:16px 20px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="color:rgba(255,255,255,0.75);font-size:10px;letter-spacing:1.5px;text-transform:uppercase" class="${bnClass}">${t('historyTitle')}</div>
        <div style="color:#fff;font-size:16px;font-weight:700">${row.memberName}</div>
        <div style="color:rgba(255,255,255,0.8);font-size:10.5px;margin-top:1px" class="mono">${row.loanId} · VO ${row.voCode} · #${row.memberNo}</div>
      </div>
      <button id="btn-close-history" style="background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:10px;width:30px;height:30px;font-size:16px;cursor:pointer">✕</button>
    </div>
    <div style="padding:16px 20px 24px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
        <div style="background:#f3e5f5;border-radius:10px;padding:10px 12px;text-align:center">
          <div class="mono" style="font-size:22px;font-weight:800;color:#7b1fa2">${missedCount}</div>
          <div style="font-size:9.5px;color:#8e5a9e;font-weight:700;text-transform:uppercase" class="${bnClass}">${t('missedCount')}</div>
        </div>
        <div style="background:#e8f5e9;border-radius:10px;padding:10px 12px;text-align:center">
          <div class="mono" style="font-size:16px;font-weight:800;color:#2e7d32">${fmt(totalPaid)}</div>
          <div style="font-size:9.5px;color:#4a8f52;font-weight:700;text-transform:uppercase" class="${bnClass}">${t('totalPaidHist')}</div>
        </div>
      </div>

      <div style="font-size:11px;font-weight:800;color:#7b1fa2;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px" class="${bnClass}">${t('remissHistTitle')}</div>
      ${remissHist.length===0?`<div style="text-align:center;color:#bbb;font-size:12.5px;padding:14px 0;margin-bottom:16px" class="${bnClass}">${t('noHistory')}</div>`:`
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:18px">
          ${remissHist.map(h=>{
            const s=outcomeMap[h.outcome]||outcomeMap.missed;
            return `<div style="background:${s.bg};border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-size:9px;color:#888;text-transform:uppercase;font-weight:700" class="${bnClass}">${t('histCommitDate')}</div>
                <div class="mono" style="font-size:12.5px;font-weight:700;color:#333">${fmtDate(h.commitmentFrom)} – ${fmtDate(h.commitmentTo)}</div>
                <div style="font-size:10.5px;font-weight:700;color:${s.c};margin-top:2px" class="${bnClass}">${s.l}${h.reason?` — ${reasonDisplay(h.reason)}`:""}</div>
              </div>
              <div style="text-align:right">
                <div style="font-size:9px;color:#888;text-transform:uppercase" class="${bnClass}">${t('histDue')}</div>
                <div class="mono" style="font-size:12px;font-weight:700;color:${s.c}">${fmt(h.dueAtTime)}</div>
              </div>
            </div>`;
          }).join("")}
        </div>`}

      <div style="font-size:11px;font-weight:800;color:#2e7d32;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px" class="${bnClass}">${t('payHistory')}</div>
      ${payments.length===0?`<div style="text-align:center;color:#bbb;font-size:12.5px;padding:14px 0" class="${bnClass}">${t('noPayments')}</div>`:`
        <div style="background:#f7f9f5;border-radius:10px;padding:4px 12px">
          ${payments.map((pm,i,arr)=>`
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#555;padding:8px 0;border-bottom:${i<arr.length-1?"1px solid #e5ece0":"none"}">
              <span class="mono">${fmtDate(pm.date)}</span>
              <span style="font-weight:700;color:#2e7d32" class="mono">${fmt(pm.amount)}</span>
            </div>`).join("")}
        </div>`}
    </div>
  </div>`;
}

  <div style="background:#fff;border-radius:18px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,0.3)">

      </div>
      <button id="btn-close-timesim" style="background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:10px;width:30px;height:30px;font-size:16px;cursor:pointer">✕</button>
    </div>

      <input type="datetime-local" id="timesim-input" value="${localVal}" style="margin-bottom:14px"/>
      <button id="btn-timesim-apply" class="btn-primary ${bnClass}" style="background:linear-gradient(135deg,#1565c0,#42a5f5);margin-bottom:16px">${t('timeSimApply')}</button>
      <div style="font-size:10px;color:#aaa;text-transform:uppercase;font-weight:700;letter-spacing:0.5px;margin-bottom:8px" class="${bnClass}">${t('timeSimQuickTitle')}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <button class="timesim-quick" data-days="1" style="background:#eef6ff;color:#1565c0;border:1.5px solid #90caf9;border-radius:9px;padding:9px 4px;font-size:12px;font-weight:700;cursor:pointer" class="${bnClass}">${t('timeSimPlus1Day')}</button>
        <button class="timesim-quick" data-days="7" style="background:#eef6ff;color:#1565c0;border:1.5px solid #90caf9;border-radius:9px;padding:9px 4px;font-size:12px;font-weight:700;cursor:pointer" class="${bnClass}">${t('timeSimPlus1Week')}</button>
        <button class="timesim-quick" data-days="30" style="background:#eef6ff;color:#1565c0;border:1.5px solid #90caf9;border-radius:9px;padding:9px 4px;font-size:12px;font-weight:700;cursor:pointer" class="${bnClass}">${t('timeSimPlus1Month')}</button>
      </div>
    </div>
  </div>`;
}

function renderNotifPopup(){
  const bnClass=lang==="bn"?"bn":"";
  const isBM=currentUser.role==="bm";
  const d=scopedData();
  let items=[];
  if(isBM){
    // FR-25: BM/ABM push is escalation-only — not the CDO's routine reason/re-miss worklist.
    const escal = d.filter(r=>r.escalated);
    items = escal.map(r=>({loanId:r.loanId,type:"escalate",
      text:`${r.memberName} (${r.cdo} — ${r.cdoName}): ${lang==='en'?'Escalated — 2+ missed commitments':'এস্কেলেটেড — ২+ বার কমিটমেন্ট মিস'}`,
      color:"#b71c1c"}));
  } else {
    // FR-17: CDO in-app alerts — Missed Commitment Date — plus BM follow-up comments on their records.
    const remiss = d.filter(r=>getStatus(r)==="remiss");
    const comments = NOTIFICATIONS.filter(n=>n.toCdoId===currentUser.cdoId);
    items=[
      ...comments.map(n=>({loanId:n.loanId,type:"comment",notifId:n.id,
        text:`${n.byName} ${lang==='en'?'commented on':'মন্তব্য করেছেন'} ${n.memberName}: "${n.message.length>60?n.message.slice(0,60)+'…':n.message}"`,
        color:"#1565c0", unread:!n.read})),
      ...remiss.map(r=>({loanId:r.loanId,type:"remiss",text:`${r.memberName}: ${lang==='en'?'Missed commitment date':'কমিটমেন্ট তারিখ মিস'}`,color:"#7f0000"})),
    ];
  }
  return `
  <div id="notif-backdrop" style="position:fixed;inset:0;z-index:200">
    <div id="notif-popup" class="popup" style="top:58px;right:52px;min-width:260px;max-width:310px;max-height:360px;overflow-y:auto">
      <div style="font-size:11px;font-weight:800;color:#d6006e;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px" class="${bnClass}">${t('notifications')}</div>
      <div style="font-size:9.5px;color:#bbb;margin-bottom:10px" class="${bnClass}">${isBM?(lang==='en'?'Escalation alerts only':'শুধুমাত্র এস্কেলেশন সতর্কতা'):(lang==='en'?'Your worklist + supervisor comments':'আপনার ওয়ার্কলিস্ট + সুপারভাইজর মন্তব্য')}</div>
      ${items.length===0?`<div style="font-size:12px;color:#bbb" class="${bnClass}">${t('noNotif')}</div>`:
        items.map(({loanId,type,text,color,notifId,unread})=>`
        <div class="notif-item" data-loan-id="${loanId}" data-type="${type}" ${notifId?`data-notifid="${notifId}"`:""} style="font-size:12px;color:${color};font-weight:${unread?700:500};padding:8px 10px;border-bottom:1px solid #f9f0f9;line-height:1.4;cursor:pointer;border-radius:7px;margin-bottom:3px;display:flex;align-items:center;gap:7px;background:${unread?"#eef6ff":"transparent"}">
          <span style="font-size:13px">${type==="escalate"?"🚨":type==="comment"?"💬":"⚠️"}</span>
          <span class="${bnClass}">${text}</span>
        </div>`).join("")}
      <div style="font-size:10px;color:#ccc;text-align:center;margin-top:8px;padding-top:6px;border-top:1px solid #f0e0f0" class="${bnClass}">${lang==='en'?'Tap to navigate to client':'ক্লায়েন্টে যেতে ট্যাপ করুন'}</div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════
// EVENT BINDING
// ══════════════════════════════════════════════════════════════
// Always show the user the direct result of an action — jumps straight to that record's
// dedicated detail page. Used after any action that can change a record's status (Record
// Collection, Update, Register). No more filter-clearing or scroll-into-view needed now
// that the detail view is its own page rather than an inline-expanded list row.
function revealRecord(loanId){
  expandedRow=loanId;
  render();
}

function bindEvents(){
  const $=id=>document.getElementById(id);

  // Lang toggle
  if($("btn-lang")) $("btn-lang").onclick=()=>{lang=lang==="en"?"bn":"en";render();};

  // Notif / Menu
  if($("btn-notif")) $("btn-notif").onclick=()=>{showNotif=!showNotif;showMenu=false;render();};
  if($("btn-menu")) $("btn-menu").onclick=()=>{showMenu=!showMenu;showNotif=false;render();};
  const nb=$("notif-backdrop"); if(nb) nb.onclick=e=>{if(e.target===nb){showNotif=false;render();}};
  const mb=$("menu-backdrop"); if(mb) mb.onclick=e=>{if(e.target===mb){showMenu=false;render();}};
  if($("btn-logout")) $("btn-logout").onclick=()=>{
    currentUser=null; showMenu=false; expandedRow=null; followUpEditRow=null;
    collectRow=null; historyRow=null; confirmDeleteFollowUp=false;
    search=""; filters={cdo:"All",voCode:"All",reason:"All",status:"All",targetDate:"",collectionDate:"",followUpStatus:"All"};
    commitToday=true; dashboardExpanded=false; showFilters=false;
    page=1; render();
  };

  // Database — export / import / reset
  if($("btn-export-db")) $("btn-export-db").onclick=()=>{ exportDB(); showMenu=false; render(); };
  if($("btn-import-db")) $("btn-import-db").onclick=()=>{ $("import-db-file")?.click(); };
  if($("import-db-file")) $("import-db-file").onchange=e=>{
    const file=e.target.files&&e.target.files[0];
    if(file) importDBFromFile(file);
  };
  if($("btn-reset-db")) $("btn-reset-db").onclick=()=>{
    if(confirm(t("resetDbConfirm"))){
      resetDB();
      currentUser=null; showMenu=false;
      render();
      toast(lang==="en"?"✅ Reset to seed data":"✅ মূল ডেটাতে রিসেট হয়েছে");
    }
  };

  // Time Simulator
  if($("btn-timesim")) $("btn-timesim").onclick=()=>{ showTimeSim=true; showMenu=false; showNotif=false; render(); };
  if($("btn-close-timesim")) $("btn-close-timesim").onclick=()=>{ showTimeSim=false; render(); };
  const tso=$("time-sim-overlay"); if(tso) tso.onclick=e=>{ if(e.target===tso){ showTimeSim=false; render(); } };
  if($("btn-timesim-apply")) $("btn-timesim-apply").onclick=()=>{
    const val=$("timesim-input")?.value;
    if(!val) return;
    const beforeScoped=scopedData().length;
    TODAY=new Date(val);
    runTimeSweep();
    const droppedScoped=beforeScoped-scopedData().length;
    showTimeSim=false;
    render();
    toast(lang==="en"?`✅ Time set to ${fmtDateTime(TODAY)}${droppedScoped?` — ${droppedScoped} Grace record(s) dropped`:""}`:`✅ সময় নির্ধারিত হয়েছে${droppedScoped?` — ${droppedScoped}টি গ্রেস রেকর্ড বাদ দেওয়া হয়েছে`:""}`);
  };
  document.querySelectorAll(".timesim-quick").forEach(b=>{
    b.onclick=()=>{
      const days=parseInt(b.dataset.days);
      const beforeScoped=scopedData().length;
      TODAY=new Date(TODAY.getTime()+days*86400000);
      runTimeSweep();
      const droppedScoped=beforeScoped-scopedData().length;
      showTimeSim=false;
      render();
      toast(lang==="en"?`✅ +${days}d — now ${fmtDateTime(TODAY)}${droppedScoped?` — ${droppedScoped} Grace record(s) dropped`:""}`:`✅ ${days} দিন এগিয়ে গেছে${droppedScoped?` — ${droppedScoped}টি গ্রেস রেকর্ড বাদ`:""}`);
    };
  });

  // Tab bar
  document.querySelectorAll(".tab-btn").forEach(b=>{
    b.onclick=()=>{activeTab=b.dataset.tab;expandedRow=null;if(activeTab==="register")resetRegForm();render();};
  });
  if($("btn-fab-new")) $("btn-fab-new").onclick=()=>{activeTab="register";resetRegForm();render();};

  // Search
  if($("search-input")) $("search-input").oninput=e=>{search=e.target.value;page=1;if(search.trim())dashboardExpanded=true;render();};

  // Filter / view-all / back toggles
  if($("btn-dismiss-push")) $("btn-dismiss-push").onclick=()=>{dailyPushDismissed=true;render();};
  if($("btn-filter")) $("btn-filter").onclick=()=>{showFilters=!showFilters;render();};
  if($("btn-view-all")) $("btn-view-all").onclick=()=>{dashboardExpanded=true;render();};
  if($("btn-back-overview")) $("btn-back-overview").onclick=()=>{dashboardExpanded=false;showFilters=false;render();};
  document.querySelectorAll(".stat-card-click").forEach(el=>{
    el.onclick=()=>{
      const statusVal=el.dataset.status;
      filters.status="All"; filters.reason="All";
      if(statusVal!=="All") filters.status=statusVal;
      commitToday=false; // a stat tile spans all records, not just today's commitments
      dashboardExpanded=true; page=1; render();
    };
  });
  if($("btn-clear")) $("btn-clear").onclick=()=>{
    search="";filters={cdo:"All",voCode:"All",reason:"All",status:"All",targetDate:"",collectionDate:"",followUpStatus:"All"};commitToday=false;page=1;render();
  };
  if($("btn-toggle-commit-today")) $("btn-toggle-commit-today").onclick=()=>{ commitToday=!commitToday; page=1; render(); };

  // Notification item click -> navigate straight to the record's detail page
  document.querySelectorAll(".notif-item").forEach(el=>{
    el.onclick=e=>{
      e.stopPropagation();
      const loanId=el.dataset.loanId;
      const type=el.dataset.type;
      const row=DATA.find(r=>r.loanId===loanId);
      if(!row) return;
      expandedRow=loanId;
      showNotif=false;
      if(type==="comment"){
        const nid=parseInt(el.dataset.notifid);
        const n=NOTIFICATIONS.find(x=>x.id===nid);
        if(n) n.read=true;
      }
      activeTab="dashboard";
      render();
    };
  });

  // Filter dropdowns
  const bindSel=(id,key)=>{const el=$(id);if(el)el.onchange=e=>{filters[key]=e.target.value;page=1;render();};};
  bindSel("f-cdo","cdo"); bindSel("f-voCode","voCode"); bindSel("f-reason","reason");
  bindSel("f-targetDate","targetDate"); bindSel("f-collectionDate","collectionDate");
  bindSel("f-followUp","followUpStatus");

  // Custom status dropdown
  const sdb=$("status-dropdown-btn"), sdm=$("status-dropdown-menu");
  if(sdb&&sdm){
    sdb.onclick=e=>{e.stopPropagation();sdm.style.display=sdm.style.display==="block"?"none":"block";};
    document.querySelectorAll(".status-opt").forEach(el=>{
      el.onclick=()=>{filters.status=el.dataset.val;page=1;sdm.style.display="none";render();};
    });
    document.addEventListener("click",function closeSD(){sdm&&(sdm.style.display="none");document.removeEventListener("click",closeSD);},true);
  }

  // Per page
  document.querySelectorAll(".pg-size-btn").forEach(b=>{b.onclick=()=>{perPage=parseInt(b.dataset.n);page=1;render();};});

  // Card expand
  document.querySelectorAll(".card-header").forEach(h=>{h.onclick=()=>{expandedRow=h.dataset.loanId;render();};});
  if($("btn-detail-back")) $("btn-detail-back").onclick=()=>{expandedRow=null;render();};

  const ov=$("overlay"); if(ov) ov.onclick=e=>{if(e.target===ov){followUpEditRow=null;collectRow=null;render();}};

  // Record Collection (CDO) — closes the loop on a commitment date, or (during an active
  // Grace Period) just logs the payment with nothing else changing.
  document.querySelectorAll(".collect-btn").forEach(b=>{b.onclick=e=>{e.stopPropagation();const loanId=b.dataset.loanId;collectRow=DATA.find(r=>r.loanId===loanId)||null;render();};});
  if($("btn-close-collect")) $("btn-close-collect").onclick=()=>{collectRow=null;render();};
  const collectAmtEl=$("collect-amount");
  const updateCollectPreview=()=>{
    if(!collectRow) return;
    const row=DATA.find(r=>r.loanId===collectRow.loanId);
    if(getStatus(row)==="grace") return; // grace mode has no outcome preview — it's always just "due decreases"
    const amt=parseFloat($("collect-amount")?.value)||0;
    const due=row.targetAmount-getCollected(row);
    const willFullyResolve = amt>=due;
    const noteEl=$("collect-outcome-note");
    const wrapEl=$("collect-new-commit-wrap");
    const reasonWrapEl=$("collect-partial-reason-wrap");
    if(noteEl) noteEl.textContent = willFullyResolve ? t("fullyResolvedNote") : "";
    if(wrapEl) wrapEl.style.display = willFullyResolve ? "none" : "block";
    if(reasonWrapEl) reasonWrapEl.style.display = willFullyResolve ? "none" : "block";
  };
  if(collectAmtEl) collectAmtEl.oninput=updateCollectPreview;
  const collectPartialReasonSel=$("collect-partial-reason");
  if(collectPartialReasonSel) collectPartialReasonSel.onchange=e=>{
    const noteWrap=$("collect-partial-reason-note-wrap"); if(noteWrap) noteWrap.style.display=e.target.value==="Other"?"block":"none";
    const err=$("collect-partial-reason-err"); if(err) err.style.display="none";
  };
  const collectPartialReasonNoteEl=$("collect-partial-reason-note");
  if(collectPartialReasonNoteEl) collectPartialReasonNoteEl.oninput=e=>{
    const err=$("collect-partial-reason-note-err"); if(err&&e.target.value.trim()) err.style.display="none";
  };
  ["collect-new-commit-from","collect-new-commit-to"].forEach(id=>{
    const el=$(id); if(el) el.oninput=()=>{ const e=$("collect-newcommit-err"); if(e) e.style.display="none"; };
  });
  if($("btn-save-collect")) $("btn-save-collect").onclick=()=>{
    const row=DATA.find(r=>r.loanId===collectRow.loanId);
    const cDate=$("collect-date")?.value||"";
    const cAmt=parseFloat($("collect-amount")?.value)||0;
    if(!cDate){toast(t("fillRequired"));return;}

    // Grace Period branch — per spec: "just the due amount will decrease and nothing else."
    // No reason, no commitment date, no missed-commitment count, no escalation.
    if(getStatus(row)==="grace"){
      row.payments.push({date:cDate, amount:cAmt});
      pushLog(row, `Grace Period collection recorded: ${fmt(cAmt)} on ${cDate}`);
      const loanId=row.loanId; collectRow=null;
      revealRecord(loanId);
      toast(lang==="en"?"✅ Collection recorded — due amount updated":"✅ আদায় রেকর্ড হয়েছে — বকেয়া হালনাগাদ হয়েছে");
      return;
    }

    const dueBefore=row.targetAmount-getCollected(row);
    const willStillBeDue = (getCollected(row)+cAmt) < row.targetAmount;
    let newCommitFrom="", newCommitTo="", newReason="", newReasonNote="";
    if(willStillBeDue){
      newCommitFrom=$("collect-new-commit-from")?.value||"";
      newCommitTo=$("collect-new-commit-to")?.value||"";
      newReason=$("collect-partial-reason")?.value||"";
      newReasonNote=$("collect-partial-reason-note")?.value.slice(0,200)||"";
      let valid=true;
      if(!newReason){ const e=$("collect-partial-reason-err"); if(e) e.style.display="block"; valid=false; }
      if(newReason==="Other" && !newReasonNote.trim()){ const e=$("collect-partial-reason-note-err"); if(e) e.style.display="block"; valid=false; }
      if(!newCommitFrom||!newCommitTo){ const e=$("collect-newcommit-err"); if(e) e.style.display="block"; valid=false; }
      if(!valid) return;
    }
    row.payments.push({date:cDate, amount:cAmt});
    pushLog(row, `Collection recorded: ${fmt(cAmt)} on ${cDate}`);
    if(willStillBeDue){
      // This commitment cycle is being closed out without full recovery — counts as a missed commitment
      if(row.commitmentTo && cAmt<dueBefore){
        row.missedCommitmentCount=(row.missedCommitmentCount||0)+1;
        row.remissLocked=true;
        row.remissHistory=row.remissHistory||[];
        row.remissHistory.push({commitmentFrom:row.commitmentFrom, commitmentTo:row.commitmentTo, detectedAt:nowStr(), outcome:cAmt>0?"partial":"missed", dueAtTime:dueBefore-cAmt, reason:newReason||row.reason||""});
        row.lastCountedCommitmentTo=row.commitmentTo;
        if(row.missedCommitmentCount>=2) row.escalated=true;
      }
      if(row.commitmentFrom && row.commitmentTo){
        row.commitmentHistory=row.commitmentHistory||[];
        row.commitmentHistory.push({from:row.commitmentFrom, to:row.commitmentTo, setOn:"—"});
      }
      row.commitmentFrom=newCommitFrom; row.commitmentTo=newCommitTo;
      // Update the reason to reflect why this round only came in partial/none — same pattern as the commitment date
      row.reason=newReason;
      row.reasonNote = newReason==="Other" ? newReasonNote : "";
      const loanId=row.loanId; collectRow=null;
      revealRecord(loanId);
      toast(lang==="en"?"✅ Collection recorded — new commitment date set":"✅ আদায় রেকর্ড হয়েছে — নতুন কমিটমেন্ট তারিখ নির্ধারিত হয়েছে");
      if(row.escalated) toast(lang==="en"?"🚨 Escalated to Branch Manager":"🚨 ব্রাঞ্চ ম্যানেজারের কাছে এস্কেলেটেড");
    } else {
      const loanId=row.loanId; collectRow=null;
      revealRecord(loanId);
      toast(lang==="en"?"✅ Fully collected — schedule miss resolved":"✅ সম্পূর্ণ আদায় হয়েছে — সিডিউল মিস সমাধান হয়েছে");
    }
  };

  // Member History modal
  document.querySelectorAll(".history-btn").forEach(b=>{b.onclick=e=>{e.stopPropagation();const loanId=b.dataset.loanId;historyRow=DATA.find(r=>r.loanId===loanId)||null;render();};});
  if($("btn-close-history")) $("btn-close-history").onclick=()=>{historyRow=null;render();};
  const ho=$("history-overlay"); if(ho) ho.onclick=e=>{if(e.target===ho){historyRow=null;render();}};

  // Follow-up (BM)
  document.querySelectorAll(".fu-btn").forEach(b=>{b.onclick=e=>{e.stopPropagation();const loanId=b.dataset.loanId;followUpEditRow=DATA.find(r=>r.loanId===loanId)||null;render();};});
  if($("btn-close-fu")) $("btn-close-fu").onclick=()=>{followUpEditRow=null;render();};
  if($("btn-save-fu")) $("btn-save-fu").onclick=()=>{
    const date=$("fu-date")?.value||"";
    const comment=$("fu-comment")?.value||"";
    if(!date||!comment){toast(t("fillRequired"));return;}
    const row=DATA.find(r=>r.loanId===followUpEditRow.loanId);
    row.followUp={date,comment,by:currentUser.name,at:nowStr()};
    pushLog(row,"Follow-up added/updated");
    notifyCdoOfComment(row, currentUser.name, comment);
    followUpEditRow=null; render();
    toast(lang==="en"?"✅ Follow-up saved — CDO notified":"✅ ফলো-আপ সংরক্ষিত হয়েছে — সিডিও-কে জানানো হয়েছে");
  };
  // Delete follow-up comment (BM only, own comment)
  document.querySelectorAll(".fu-delete-btn").forEach(b=>{b.onclick=e=>{e.stopPropagation();confirmDeleteFollowUp=b.dataset.loanId;render();};});
  document.querySelectorAll(".fu-delete-cancel").forEach(b=>{b.onclick=e=>{e.stopPropagation();confirmDeleteFollowUp=false;render();};});
  document.querySelectorAll(".fu-delete-confirm").forEach(b=>{b.onclick=e=>{
    e.stopPropagation();
    const loanId=b.dataset.loanId;
    const row=DATA.find(r=>r.loanId===loanId);
    if(row){ row.followUp=null; pushLog(row,"Follow-up comment deleted"); }
    confirmDeleteFollowUp=false; render();
    toast(t("commentDeleted"));
  };});

  // Pagination
  if($("pg-first")) $("pg-first").onclick=()=>{page=1;render();};
  if($("pg-prev")) $("pg-prev").onclick=()=>{page=Math.max(1,page-1);render();};
  if($("pg-next")) $("pg-next").onclick=()=>{const f=getFiltered();page=Math.min(Math.ceil(f.length/perPage)||1,page+1);render();};
  if($("pg-last")) $("pg-last").onclick=()=>{const f=getFiltered();page=Math.ceil(f.length/perPage)||1;render();};
  document.querySelectorAll(".pg-num").forEach(b=>{b.onclick=()=>{page=parseInt(b.dataset.n);render();};});

  // Register form — every field persists straight into regForm as the user types,
  // so a full re-render (opening the bell, etc.) never wipes what's been entered.
  if($("btn-reg-cancel")) $("btn-reg-cancel").onclick=()=>{activeTab="dashboard";render();};
  if($("btn-reg-back")) $("btn-reg-back").onclick=()=>{activeTab="dashboard";render();};

  if($("btn-qr-scan")) $("btn-qr-scan").onclick=()=>{toast(lang==="en"?"📷 QR scanning not available in this demo":"📷 এই ডেমোতে কিউআর স্ক্যান উপলব্ধ নয়");};

  const bindRegField=(id,key,parse)=>{
    const el=$(id); if(!el) return;
    el.oninput=e=>{ regForm[key] = parse ? parse(e.target.value) : e.target.value; };
  };
  bindRegField("reg-voCode","voCode");
  bindRegField("reg-memberName","memberName");
  bindRegField("reg-memberNo","memberNo");
  bindRegField("reg-phone","phone");
  bindRegField("reg-collectedAmt","collectedAmt");
  bindRegField("reg-targetAmt","targetAmt");
  bindRegField("reg-remarks","remarks");
  const regVoSel=$("reg-voCode"); if(regVoSel) regVoSel.onchange=e=>{regForm.voCode=e.target.value;};

  // Disbursement Date drives Grace Period (see isGraceActive). It's pre-filled from the
  // selected loan's typical tenure relative to the VO Collection Date, but the CDO can edit
  // it directly — e.g. to deliberately test Grace Period by setting it within the last 15 days.
  const computeDefaultDisb=(loan,targetDateStr)=>{
    if(!loan) return "";
    const base = targetDateStr ? new Date(targetDateStr) : new Date(TODAY);
    base.setMonth(base.getMonth()-loan.monthsAgo);
    return base.toISOString().split("T")[0];
  };
  // Updates the Disbursement Date field, the Grace Period Yes/No tiles, and whether Miss
  // Information is shown — all via direct DOM writes (no full render()) so focus/cursor
  // position in whatever's being typed into is never lost.
  const updateGraceUI=()=>{
    const el=$("reg-disbursementDate"); if(el) el.value=regForm.disbursementDate;
    const g=regFormIsGrace();
    const box=$("reg-grace-box");
    if(box){ box.style.background=g?'#f3e5f5':'#fff'; box.style.borderColor=g?'#ce93d8':'#e0d0ea'; }
    const yesPill=$("reg-grace-yes-pill");
    if(yesPill){ yesPill.style.background=g?'#7b1fa2':'#fdf5f9'; yesPill.style.color=g?'#fff':'#7b1fa2'; }
    const noPill=$("reg-grace-no-pill");
    if(noPill){ noPill.style.background=!g?'#d6006e':'#fdf5f9'; noPill.style.color=!g?'#fff':'#c8005e'; }
    const note=$("reg-grace-note"); if(note) note.style.display=g?"block":"none";
    const missInfo=$("reg-miss-info-section"); if(missInfo) missInfo.style.display=g?"none":"block";
    const submitBtn=$("btn-reg-submit");
    if(submitBtn) submitBtn.textContent=g?(lang==='en'?'Save Grace Period Record':'গ্রেস পিরিয়ড সংরক্ষণ করুন'):(lang==='en'?'Save Schedule Miss':'সংরক্ষণ করুন');
  };
  const disbEl=$("reg-disbursementDate");
  if(disbEl) disbEl.oninput=e=>{ regForm.disbursementDate=e.target.value; regForm.disbursementDateTouched=true; updateGraceUI(); };

  if($("reg-targetDate")) $("reg-targetDate").oninput=e=>{
    regForm.targetDate=e.target.value;
    if(!regForm.disbursementDateTouched){
      regForm.disbursementDate=computeDefaultDisb(loanById(regForm.loanProductId),regForm.targetDate);
      updateGraceUI();
    }
  };

  // Loan Selection -> preview
  const loanSel=$("reg-loan");
  if(loanSel) loanSel.onchange=e=>{
    regForm.loanProductId=e.target.value;
    const loan=loanById(e.target.value);
    const prev=$("reg-loan-preview");
    if(loan&&prev){
      prev.style.display="block";
      prev.innerHTML = `${t('disbursedAmount')}: <b>${fmt(loan.disbursedAmount)}</b> &nbsp;·&nbsp; ${lang==='en'?'Standard installment':'নিয়মিত কিস্তি'}: <b>${fmt(loan.installment)}</b>`;
      // Auto-fill the Miss/Installment Amount from state, not the DOM — the field may not exist
      // in the DOM yet if the Grace Period prompt hasn't been answered, since that section gates
      // Miss Information's visibility. Setting regForm directly means it's correct whenever that
      // section does render.
      if(!regForm.targetAmt){
        regForm.targetAmt=String(loan.installment);
        const amtEl=$("reg-targetAmt"); if(amtEl) amtEl.value=loan.installment;
      }
    } else if(prev){ prev.style.display="none"; }
    if(!regForm.disbursementDateTouched){
      regForm.disbursementDate=computeDefaultDisb(loan,regForm.targetDate);
      updateGraceUI();
    }
  };

  ["reg-commitFrom","reg-commitTo"].forEach(id=>{
    const el=$(id); if(!el) return;
    el.oninput=e=>{
      regForm[id==="reg-commitFrom"?"commitFrom":"commitTo"]=e.target.value;
      const ce=$("reg-commit-err"); if(ce&&$("reg-commitFrom")?.value&&$("reg-commitTo")?.value) ce.style.display="none";
    };
  });

  // Reason dropdown
  const regReasonSel=$("reg-reason");
  if(regReasonSel) regReasonSel.onchange=e=>{
    regForm.reason=e.target.value;
    const noteWrap=$("reg-reason-note-wrap"); if(noteWrap) noteWrap.style.display=regForm.reason==="Other"?"block":"none";
    const err=$("reg-reason-err"); if(err) err.style.display="none";
  };
  const regReasonNoteEl=$("reg-reason-note");
  if(regReasonNoteEl) regReasonNoteEl.oninput=e=>{
    regForm.reasonNote=e.target.value;
    const err=$("reg-reason-note-err"); if(err&&e.target.value.trim()) err.style.display="none";
  };

  // Collection status chips (Partial / Full miss)
  document.querySelectorAll(".reg-collection-chip").forEach(b=>{
    b.onclick=()=>{
      regForm.collectionStatus=b.dataset.key;
      const err=$("reg-collection-err"); if(err) err.style.display="none";
      const collectedWrap=$("reg-collected-amt-wrap"); if(collectedWrap) collectedWrap.style.display=regForm.collectionStatus==="partial"?"block":"none";
      document.querySelectorAll(".reg-collection-chip").forEach(x=>{
        const on=x.dataset.key===regForm.collectionStatus;
        x.style.background=on?"#d6006e":"#fdf5f9"; x.style.color=on?"#fff":"#c8005e";
      });
    };
  });

  if($("btn-reg-submit")) $("btn-reg-submit").onclick=()=>{
    const voCode=$("reg-voCode")?.value;
    const memberName=$("reg-memberName")?.value.trim();
    const memberNo=$("reg-memberNo")?.value.trim();
    const phone=$("reg-phone")?.value.trim();
    const loanProductId=$("reg-loan")?.value;
    const disbursementDate=$("reg-disbursementDate")?.value||regForm.disbursementDate;
    const isGrace=regFormIsGrace();
    const loan=loanById(loanProductId);

    // Grace Period needs nothing beyond who/what/when-disbursed — no VO Collection Date,
    // Reason, Commitment Date or Collection Status. Miss Information is hidden for exactly
    // this reason, so read from it only when it's actually showing (non-Grace).
    const targetDate = isGrace ? nowDateStr() : $("reg-targetDate")?.value;
    const targetAmt = isGrace ? (loan?loan.installment:0) : parseFloat($("reg-targetAmt")?.value);
    const commitFrom = isGrace ? "" : ($("reg-commitFrom")?.value||"");
    const commitTo = isGrace ? "" : ($("reg-commitTo")?.value||"");
    const collectedAmt = isGrace ? 0 : (parseFloat($("reg-collectedAmt")?.value)||0);
    const remarks = isGrace ? "" : ($("reg-remarks")?.value.trim()||"");
    const reason = isGrace ? "" : ($("reg-reason")?.value||"");
    const reasonNote = isGrace ? "" : ($("reg-reason-note")?.value.slice(0,200)||"");
    const collectionStatus = isGrace ? "n/a" : regForm.collectionStatus;

    let ok = voCode&&memberName&&memberNo&&phone&&loanProductId&&disbursementDate
      && (isGrace ? true : (targetDate && targetAmt && reason && collectionStatus && commitFrom && commitTo
          && (reason!=="Other" || reasonNote.trim())));
    if(!ok){
      const errEl=$("reg-err"); if(errEl) errEl.style.display="block";
      if(!isGrace){
        const rErr=$("reg-reason-err"); if(rErr&&!reason) rErr.style.display="block";
        const rnErr=$("reg-reason-note-err"); if(rnErr&&reason==="Other"&&!reasonNote.trim()) rnErr.style.display="block";
        const cErr=$("reg-collection-err"); if(cErr&&!collectionStatus) cErr.style.display="block";
        const cmErr=$("reg-commit-err"); if(cmErr&&(!commitFrom||!commitTo)) cmErr.style.display="block";
      }
      return;
    }

    // Collection Status supplies what ERP would normally have reported (FR-02 still classifies automatically from this)
    let payments=[];
    if(!isGrace && collectionStatus==="partial") payments=[{date:targetDate,amount:collectedAmt||Math.round(targetAmt/2)}];

    const newRow = mkRow({
      voCode, memberNo, memberName, phone,
      disbursementDate, disbursedAmount:loan.disbursedAmount,
      targetDate, targetAmount:targetAmt,
      reason, reasonNote,
      commitmentFrom:commitFrom, commitmentTo:commitTo,
      payments, remarks,
      loanProductId:loan.id, loanLabel:loan.label,
      cdo:currentUser.cdoId, cdoName:currentUser.name,
      previousMisses:0, submissionDate:nowDateStr(),
    });
    pushLog(newRow,"Created via manual Register entry (no-ERP mode)");
    DATA.push(newRow);
    runTimeSweep(); // catch it immediately if the CDO entered a commitment range already in the past
    resetRegForm();
    activeTab="dashboard";
    revealRecord(newRow.loanId);
    toast(t("regSaved"));
  };
}

// ══════════════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════════════
// Boot sequence:
//  1. Browser storage (most recent state) wins if present.
//  2. Otherwise, try fetching ./database.json — this only succeeds when the app is served
//     over http(s):// (a local server); browsers block fetch() for file:// for security,
//     so this silently falls through when you just double-click the file.
//  3. Otherwise, fall back to the built-in generated seed data.
// ══════════════════════════════════════════════════════════════
async function bootApp(){
  if(loadDB()){
    runTimeSweep();
  } else {
    let loadedFromFile=false;
    try{
      const resp=await fetch("./database.json");
      if(resp.ok){
        const db=await resp.json();
        if(db && Array.isArray(db.data)){
          TODAY = new Date(db.today);
          __loanSeq = db.loanSeq||0;
          __notifId = db.notifSeq||0;
          DATA = db.data;
          NOTIFICATIONS = db.notifications||[];
          loadedFromFile=true;
        }
      }
    }catch(e){ /* file:// (fetch blocked) or database.json missing — fall through */ }

    if(!loadedFromFile){
      DATA = generateData();
      DATA.filter(r=>r.followUp).forEach(r=>{
        notifyCdoOfComment(r, r.followUp.by, r.followUp.comment);
        NOTIFICATIONS[0].read = true;
        NOTIFICATIONS[0].at = r.followUp.at;
      });
    }
    runTimeSweep();
    saveDB();
  }

  // Deep-link auto-login from the landing page (?role=cdo or ?role=bm)
  try{
    const params=new URLSearchParams(location.search);
    const roleParam=params.get("role");
    if(roleParam==="cdo"){ currentUser=USERS["1234"]; dailyPushDismissed=false; }
    else if(roleParam==="bm"){ currentUser=USERS["9999"]; dailyPushDismissed=true; }
  }catch(e){}

  render();
}
bootApp();
</script>
</body>
