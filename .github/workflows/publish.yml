# GitHub Pages serves this site from the gh-pages branch.
# Every push to main is mirrored there, so publishing is just: git push origin main
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror main to gh-pages
        run: git push --force origin HEAD:gh-pages
