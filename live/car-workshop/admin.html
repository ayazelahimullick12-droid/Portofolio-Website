<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h2>Admin Panel</h2>

    <h4>Add Appointment</h4>
    <form method="post" class="row g-3 mb-4">
        <input type="hidden" name="add" value="1">
        <div class="col-md-4">
            <select name="user" class="form-control">
            </select>
        </div>
        <div class="col-md-4">
            <input type="date" name="date" class="form-control" required>
        </div>
        <div class="col-md-4">
            <select name="mechanic" class="form-control">
            </select>
        </div>
        <div class="col-md-12">
            <button class="btn btn-success">Add Appointment</button>
        </div>
    </form>

    <h4>All Appointments</h4>
    <table class="table table-bordered" id="apps"></table>

    <h4>Mechanic Limits</h4>
    <table class="table table-bordered" id="limits"></table>

    <a href="admin_logout.html" class="btn btn-danger">Logout</a>
</div>
<script src="cw.js"></script><script>CW.run('admin')</script>
</body>
</html>
